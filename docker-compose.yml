services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linksstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linksstore}
      POSTGRES_DB: ${POSTGRES_DB:-linksstore}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-linksstore}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-linksstore}:${POSTGRES_PASSWORD:-linksstore}@db:5432/${POSTGRES_DB:-linksstore}
    ports:
      - '${APP_PORT:-3000}:4321'

volumes:
  db-data:
